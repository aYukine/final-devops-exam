<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student/Employee ID Card View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .id-card-container {
            width: 350px;
            height: 520px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #2c3e50;
            background: #ffffff;
        }
        .card-header-banner {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 15px;
        }
        .profile-avatar {
            width: 120px;
            height: 140px;
            object-fit: cover;
            border: 3px solid #2a5298;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-secondary d-flex justify-content-center align-middle py-5">

    <div class="id-card-container shadow-lg d-flex flex-column justify-content-between">
        <div class="card-header-banner">
            <h5 class="m-0 fw-bold">INSTITUTE OF TECHNOLOGY</h5>
            <small class="text-white-50" th:text="${profile.profileType}">IDENTIFICATION CARD</small>
        </div>

        <div class="text-center px-3 my-2">
            <img th:src="@{'/api/profiles/' + ${profile.id} + '/photo'}" class="profile-avatar mb-2" alt="Avatar"/>
            
            <h4 class="m-0 text-dark fw-bold" th:text="${profile.fullName}">Pholl Chanphayuk</h4>
            <p class="text-muted small mb-1" th:text="${profile.email}">user@domain.com</p>
            
            <div class="badge bg-primary px-3 py-1 my-1" th:text="${profile.department}">DEPT</div>
            <div class="fw-bold text-danger mt-1" th:text="${profile.registrationNumber}">2026-DEPT-001</div>
        </div>

        <div class="bg-light p-2 text-center border-top">
            <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                <img th:src="'data:image/png;base64,' + ${qrCode}" style="width: 75px; height: 75px;" alt="QR Code"/>
            </div>
            <img th:src="'data:image/png;base64,' + ${barcode}" style="width: 200px; height: 35px;" alt="Barcode"/>
        </div>
    </div>

</body>
</html>
