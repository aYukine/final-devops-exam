<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ID Card Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
<div class="container">
    <h1 class="mb-4 fw-bold text-dark">ID Card Registry Dashboard</h1>
    
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="mb-3 fw-bold">Register New Profile</h4>
                <form action="/profiles/create" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullName" class="form-control" required placeholder="Pholl Chanphayuk">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="pholl@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department / Unit</label>
                        <input type="text" name="department" class="form-control" required placeholder="ICT">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Profile Class Designation</label>
                        <select name="profileType" class="form-select">
                            <option value="STUDENT">STUDENT</option>
                            <option value="EMPLOYEE">EMPLOYEE</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Profile Image (JPEG/PNG)</label>
                        <input type="file" name="photo" class="form-control" accept="image/jpeg,image/png">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Save and Generate Data</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0 p-4">
                <h4 class="mb-3 fw-bold">Registered Members Base</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Reg Number</th>
                                <th>Full Name</th>
                                <th>Department</th>
                                <th>Classification</th>
                                <th class="text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${profiles}">
                                <td class="fw-bold text-primary" th:text="${p.registrationNumber}">2026-ICT-001</td>
                                <td th:text="${p.fullName}">Name</td>
                                <td th:text="${p.department}">Dept</td>
                                <td><span class="badge bg-success" th:text="${p.profileType}">STUDENT</span></td>
                                <td class="text-center">
                                    <a th:href="@{'/profiles/' + ${p.id} + '/card'}" target="_blank" class="btn btn-sm btn-outline-dark">
                                        View ID Card
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${profiles.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">No active member profiles found in the system registry.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
