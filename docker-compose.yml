version: '3.8'

services:
  web-server:
    build: .
    container_name: web-app-container
    ports:
      - "8443:8080"
      - "2222:2222"
    depends_on:
      - mysql-db
    networks:
      - idcard-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "A-PHOLL_Chanphayuk-db"
      MYSQL_ROOT_PASSWORD: "Hello@123"
    networks:
      - idcard-network

networks:
  idcard-network:
    driver: bridge